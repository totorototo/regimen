name: CI

# Waymark's checks without its deploy (no site yet): Zig tests, lint, formatting, unit
# tests, a production build and the real WASM boundary (the built worker run in Node against
# the synthetic fixture), then the Playwright tests on that build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Zig formatting
        run: zig fmt --check zig/regimen.zig zig/build.zig zig/build.extra.zig

      # TIGER_STYLE's 100 columns, as gpxz's CI; zig fmt doesn't enforce it.
      - name: Zig lines are 100 columns or fewer
        run: >-
          LC_ALL=C awk 'length > 100 { print FILENAME ":" FNR; bad = 1 } END { exit bad }'
          zig/*.zig

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Run Zig tests
        run: npm run test:zig

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Check the WASM boundary
        run: node scripts/check-wasm.mjs zig/testdata/route.gpx

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The built dist/ in real Chromium: the WASM worker, the model form, the plan table, the
  # plan.json download and reopening it.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs the runner's system libraries.
      - name: Install Playwright system dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
